name: Propose a rule
description: A rule for coding agents, with the real failure behind it
title: "Rule: "
labels: ["new rule"]
body:
  - type: input
    id: rule
    attributes:
      label: The rule
      description: One imperative sentence an agent can follow.
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What the agent claimed
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What was actually true, and how you found out
      description: The command, output or number that showed the difference.
    validations:
      required: true
  - type: dropdown
    id: evidence-type
    attributes:
      label: What kind of evidence is this?
      options:
        - Public reproduction with command and output
        - Anonymized first-hand incident (raw records are private)
        - Operational guidance or static review (not a reproduced incident)
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: When should this rule not apply?
      description: Give a counterexample or limit so one failure does not become an overbroad instruction.
